<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title description">
<title id="title">Meeting Preparation: build map</title>
<desc id="description">Three stages of the tutorial. Each card is a group of steps, not a single canvas node.</desc>
<rect width="1000" height="250" rx="14" fill="#f8fafc"/>
<rect x="18" y="20" width="304" height="208" rx="12" fill="white" stroke="#c7d2fe" stroke-width="2"/>
<circle cx="44" cy="47" r="14" fill="#4f46e5"/>
<text x="44" y="53" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="white">1</text>
<text x="66" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#312e81">Find meetings</text>
<text x="36" y="95" font-family="Arial,sans-serif" font-size="16" fill="#334155">Read a short calendar window</text>
<text x="36" y="127" font-family="Arial,sans-serif" font-size="16" fill="#334155">Limit to test meetings</text>
<text x="36" y="159" font-family="Arial,sans-serif" font-size="16" fill="#334155">Enter Loop Over Items</text>
<path d="M 327 124 h 14 m -5 -5 l 5 5 -5 5" fill="none" stroke="#4f46e5" stroke-width="2"/>
<rect x="348" y="20" width="304" height="208" rx="12" fill="white" stroke="#c7d2fe" stroke-width="2"/>
<circle cx="374" cy="47" r="14" fill="#4f46e5"/>
<text x="374" y="53" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="white">2</text>
<text x="396" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#312e81">Repeat from L</text>
<text x="366" y="95" font-family="Arial,sans-serif" font-size="16" fill="#334155">Look up the current customer</text>
<text x="366" y="127" font-family="Arial,sans-serif" font-size="16" fill="#334155">Write the meeting brief</text>
<text x="366" y="159" font-family="Arial,sans-serif" font-size="16" fill="#334155">Keep meeting title and brief</text>
<text x="366" y="191" font-family="Arial,sans-serif" font-size="16" fill="#334155">Return to the Loop</text>
<path d="M 657 124 h 14 m -5 -5 l 5 5 -5 5" fill="none" stroke="#4f46e5" stroke-width="2"/>
<rect x="678" y="20" width="304" height="208" rx="12" fill="white" stroke="#c7d2fe" stroke-width="2"/>
<circle cx="704" cy="47" r="14" fill="#4f46e5"/>
<text x="704" y="53" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="white">3</text>
<text x="726" y="54" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#312e81">Finish from D</text>
<text x="696" y="95" font-family="Arial,sans-serif" font-size="16" fill="#334155">Assemble collected briefs</text>
<text x="696" y="127" font-family="Arial,sans-serif" font-size="16" fill="#334155">Create → Update Google Doc</text>
<text x="696" y="159" font-family="Arial,sans-serif" font-size="16" fill="#334155">Check every meeting section</text>
</svg>
